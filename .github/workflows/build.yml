# Tests and builds both apps on every push, and publishes a release for every v* tag.
#
# One file, two hosts. GitHub runs it on its own machines, and the home Gitea runs the same file on
# its own runner. Only GitHub publishes releases, because GitHub is where Vitals looks for them.
#
# What gets published is the debug build, the one that has been installed on the phone all along:
# it keeps `adb shell run-as`, which is how the database and files/link-log.txt are read back.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # The certificate of this PC's debug key, which signed the app on the phone. An APK signed with
  # any other key will not install over it without uninstalling first, and uninstalling deletes
  # the readings, so a release signed with anything else is refused below. Public by nature:
  # every APK carries it.
  RELEASE_CERT_SHA256: 11f9dc7b844f47cc149bd9fe2dbea69b662d6239056ff317f5f8518810569910

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gitea's runner starts every job in a fresh container, so without these caches each build
      # downloaded everything again: the JDK, the Android SDK, Gradle and every dependency, and
      # Robolectric's Android images for the tests. That was most of a 26-minute build. Gitea's
      # runner serves the same cache API as GitHub, and GitHub's machines already have the JDK and
      # SDK installed, so only Gradle and Robolectric are cached there.
      - name: Where the tools go
        if: github.server_url != 'https://github.com'
        run: |
          sdk="${ANDROID_HOME:-$HOME/android-sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"

      - name: Cache the JDK and Android SDK
        if: github.server_url != 'https://github.com'
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}
            ${{ runner.tool_cache }}/Java_Temurin-Hotspot_jdk
          key: tools-${{ runner.os }}-jdk17-${{ hashFiles('vitals/build.gradle.kts', 'app/build.gradle.kts') }}
          restore-keys: tools-${{ runner.os }}-jdk17-

      - name: Cache Robolectric's Android images
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('vitals/build.gradle.kts') }}
          restore-keys: robolectric-${{ runner.os }}-

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          # Gradle's own download, the dependencies and the build cache, kept between runs.
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          # Only the command-line tools. Gradle fetches the platform and build tools it needs, and
          # the default package list adds the obsolete "tools" package, which nothing here uses.
          packages: ""

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.R99_DEBUG_KEYSTORE }}
        run: |
          # Without the secret the build still works, signed with a throwaway key: fine for
          # testing, never for a release. Gitea has no copy unless it is given the same secret, so
          # its APKs test the code but will not install over the phone's app.
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/r99.keystore"
            echo "R99_KEYSTORE=$RUNNER_TEMP/r99.keystore" >> "$GITHUB_ENV"
          fi

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Build
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APKs after the version
        run: |
          version=$(sed -n 's/^r99\.version=//p' gradle.properties)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p out
          cp vitals/build/outputs/apk/debug/vitals-debug.apk "out/vitals-$version.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "out/ring-debugger-$version.apk"

      # upload-artifact@v4 refuses any host but github.com: on Gitea it fails with "not currently
      # supported on GHES", after the build it was meant to keep has already passed. v3 would work
      # there, but GitHub fails any workflow that so much as names v3, skipped or not. So Gitea
      # gets ChristopherHX's fork, which is upstream v4.3.0 with that one check removed: a
      # three-line change, pinned to the commit rather than a branch that could move.
      - uses: actions/upload-artifact@v4
        if: github.server_url == 'https://github.com'
        with:
          name: vitals-apks-${{ env.VERSION }}-build${{ github.run_number }}
          path: out/*.apk

      - uses: ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7 # v4
        if: github.server_url != 'https://github.com'
        with:
          name: vitals-apks-${{ env.VERSION }}-build${{ github.run_number }}
          path: out/*.apk

      - name: Check the release is what it says it is
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # The tag names the version the apps were actually built as, or Vitals would offer a
          # release it then never stops offering.
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME but gradle.properties says $VERSION"
            exit 1
          fi
          # Signed with the phone's key, or it cannot be installed as an update. Required where the
          # release is published; elsewhere only checked if the key was handed over, since a
          # runner without it has nothing to publish.
          if [ "$GITHUB_SERVER_URL" = "https://github.com" ] || [ -n "${R99_KEYSTORE:-}" ]; then
            apksigner="$(ls -1d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
            for apk in out/*.apk; do
              if ! "$apksigner" verify --print-certs "$apk" | grep -qi "SHA-256 digest: $RELEASE_CERT_SHA256"; then
                echo "::error::$apk is not signed with the release key. Is the R99_DEBUG_KEYSTORE secret set?"
                exit 1
              fi
            done
          fi
          # The release notes are this version's section of the changelog.
          awk -v heading="## $VERSION " 'index($0, heading) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') && github.server_url == 'https://github.com'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/*.apk --title "Vitals $VERSION" --notes-file notes.md
