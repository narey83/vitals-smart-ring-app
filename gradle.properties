org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Reuse task outputs a previous build already produced, and build the two apps side by side.
# In CI the build cache travels in the cached Gradle home, so an unchanged module is not rebuilt.
org.gradle.caching=true
org.gradle.parallel=true

# The one version for the whole repository. Both apps are built from it, each release is tagged
# v<version> on GitHub, and Vitals compares itself against the newest of those tags. Bump it,
# add the release to CHANGELOG.md, commit, then tag.
r99.version=0.3.0
r99.developer=John Narey
r99.repo=narey83/vitals-smart-ring-app
